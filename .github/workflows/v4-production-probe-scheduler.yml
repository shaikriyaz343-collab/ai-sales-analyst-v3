name: V4 Production Probe Scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional exact V4 release SHA; defaults to current V4 branch head"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/workflows/v4-production-probe-scheduler.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: v4-production-probe-scheduler
  cancel-in-progress: true

jobs:
  dispatch-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Drive exact-SHA production probe cadence
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseSha = process.env.RELEASE_SHA.trim();
            const eventName = process.env.EVENT_NAME;

            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'v4/saas-foundation',
            });
            const currentSha = branch.data.commit.sha;
            const targetSha = releaseSha || currentSha;

            if (releaseSha && releaseSha !== currentSha) {
              core.setFailed(
                'Requested release SHA ' + releaseSha +
                ' does not match current v4/saas-foundation head ' + currentSha + '.',
              );
              return;
            }

            async function listRuns() {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'v4/saas-foundation',
                per_page: 100,
              });
              return response.data.workflow_runs || [];
            }

            async function latestProbeRun() {
              return (await listRuns())
                .filter(run =>
                  run &&
                  run.name === 'V4 Production Probe' &&
                  run.head_sha === targetSha
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() - new Date(a.created_at).getTime(),
                )[0] || null;
            }

            async function latestSuccessfulObservation() {
              return (await listRuns())
                .filter(run =>
                  run &&
                  run.name === 'V4 Production Observation Window' &&
                  run.head_sha === targetSha &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() - new Date(a.created_at).getTime(),
                )[0] || null;
            }

            async function latestReadinessRun() {
              return (await listRuns())
                .filter(run =>
                  run &&
                  run.name === 'V4 Release Readiness' &&
                  run.head_sha === targetSha
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() - new Date(a.created_at).getTime(),
                )[0] || null;
            }

            const observation = await latestSuccessfulObservation();
            if (observation) {
              const readiness = await latestReadinessRun();
              const readinessActive =
                readiness &&
                (readiness.status === 'queued' ||
                  readiness.status === 'in_progress');

              if (!readinessActive) {
                core.info(
                  'Successful exact-SHA observation window detected: #' +
                  observation.id +
                  '. Dispatching exact-SHA V4 Release Readiness.',
                );

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'v4-release-readiness.yml',
                  ref: 'v4/saas-foundation',
                  inputs: {
                    release_sha: targetSha,
                  },
                });

                core.summary
                  .addHeading('V4 Release Readiness Trigger')
                  .addRaw('Target release SHA: ' + targetSha + '\n')
                  .addRaw('Successful observation window: ' + observation.html_url + '\n')
                  .addRaw('Dispatched exact-SHA V4 Release Readiness.\n')
                  .write();
              } else {
                core.info(
                  'V4 Release Readiness is already ' +
                  readiness.status +
                  '; no duplicate dispatch.',
                );
              }
            }

            async function waitForRailwaySuccess(ref) {
              const railwayContexts = [
                'satisfied-enthusiasm - ai-sales-analyst-v3',
                'satisfied-enthusiasm - peaceful-mindfulness',
              ];
              const deadline = Date.now() + 7 * 60 * 1000;

              while (Date.now() < deadline) {
                const combined = await github.rest.repos.getCombinedStatusForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });

                const statusByContext = new Map(
                  (combined.data.statuses || []).map(status => [status.context, status.state]),
                );

                const notReady = railwayContexts.filter(
                  contextName => statusByContext.get(contextName) !== 'success',
                );

                if (!notReady.length) {
                  return;
                }

                core.info(
                  'Railway deployment not ready yet: ' +
                  notReady.join(', ') +
                  '. Waiting 15 seconds.',
                );
                await new Promise(resolve => setTimeout(resolve, 15_000));
              }

              throw new Error(
                'Timed out waiting for Railway deployment success for ' +
                ref +
                '.',
              );
            }

            const minimumProbeSpacingMs = 25 * 60 * 1000;
            const latestProbe = await latestProbeRun();

            if (latestProbe) {
              const ageMs =
                Date.now() - new Date(latestProbe.created_at).getTime();

              if (ageMs < minimumProbeSpacingMs) {
                const remainingMs = minimumProbeSpacingMs - ageMs;
                core.info(
                  'Latest exact-SHA probe #' + latestProbe.run_number +
                  ' is ' + (ageMs / 60000).toFixed(1) +
                  ' minutes old. Waiting ' + (remainingMs / 60000).toFixed(1) +
                  ' minutes.',
                );
                await new Promise(resolve => setTimeout(resolve, remainingMs));
              }
            }

            const latestAfterWait = await latestProbeRun();
            if (latestAfterWait) {
              const ageAfterWaitMs =
                Date.now() - new Date(latestAfterWait.created_at).getTime();

              if (
                latestAfterWait.status !== 'completed' &&
                ageAfterWaitMs < minimumProbeSpacingMs
              ) {
                core.info(
                  'A newer exact-SHA probe #' + latestAfterWait.run_number +
                  ' is already ' + (ageAfterWaitMs / 60000).toFixed(1) +
                  ' minutes old and still ' + latestAfterWait.status +
                  '. Skipping duplicate dispatch.',
                );
                return;
              }
            }

            const branchAfterWait = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: 'v4/saas-foundation',
            });
            const currentShaAfterWait = branchAfterWait.data.commit.sha;

            if (currentShaAfterWait !== targetSha) {
              core.setFailed(
                'V4 branch head changed during scheduling from ' +
                targetSha +
                ' to ' +
                currentShaAfterWait +
                '. Stopping rather than probing a different release.',
              );
              return;
            }

            await waitForRailwaySuccess(targetSha);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'v4-production-probe.yml',
              ref: 'v4/saas-foundation',
              inputs: {
                release_sha: targetSha,
              },
            });

            core.summary
              .addHeading('V4 Production Probe Scheduler')
              .addRaw('Trigger: ' + eventName + '\n')
              .addRaw('Target release SHA: ' + targetSha + '\n')
              .addRaw('Railway API/frontend statuses: success\n')
              .addRaw('Next exact-SHA production probe dispatched.\n')
              .write();

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'v4-production-probe-scheduler.yml',
              ref: 'main',
              inputs: {
                release_sha: targetSha,
              },
            });

            core.info('Self-chained the scheduler for the next exact-SHA production probe.');

# Deliberate operational design:
# - hourly cron is a recovery backstop
# - each cycle enforces a 25-minute minimum probe spacing
# - successful observation evidence automatically triggers exact-SHA release readiness
# - every cycle re-validates the frozen V4 branch SHA
# - the 20-run/24h/0-failure observation gate is unchanged

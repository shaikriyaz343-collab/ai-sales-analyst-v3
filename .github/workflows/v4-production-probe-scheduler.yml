name: V4 Production Probe Scheduler

on:
  workflow_run:
    workflows:
      - "V4 Production Probe"
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional exact V4 release SHA; defaults to current V4 branch head"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/workflows/v4-production-probe-scheduler.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: v4-production-probe-scheduler
  cancel-in-progress: false

jobs:
  dispatch-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch exact V4 production probe
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseSha = process.env.RELEASE_SHA.trim();
            const eventName = process.env.EVENT_NAME;

            // A probe completion is the primary self-healing cadence. Ignore
            // non-success completions and runs from any branch other than V4.
            if (eventName === 'workflow_run') {
              const sourceRun = context.payload.workflow_run;
              if (!sourceRun || sourceRun.name !== 'V4 Production Probe') {
                core.info('Ignoring unrelated workflow_run event.');
                return;
              }
              if (
                sourceRun.status !== 'completed' ||
                sourceRun.conclusion !== 'success' ||
                sourceRun.head_branch !== 'v4/saas-foundation'
              ) {
                core.info(
                  'Ignoring probe completion that is not a successful V4 production probe.',
                );
                return;
              }
            }

            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'v4/saas-foundation',
            });
            const currentSha = branch.data.commit.sha;

            const eventReleaseSha =
              eventName === 'workflow_run'
                ? context.payload.workflow_run.head_sha
                : '';

            const targetSha = releaseSha || eventReleaseSha || currentSha;

            if (targetSha !== currentSha) {
              core.setFailed(
                'Target release SHA ' + targetSha +
                ' does not match current v4/saas-foundation head ' + currentSha + '.',
              );
              return;
            }

            // Keep a minimum spacing between probes so scheduler retries or
            // delayed cron deliveries cannot create a noisy burst. The
            // workflow_run self-chain waits first; schedule/manual runs use
            // this same guard as a safety net.
            async function getLatestProbe() {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'v4/saas-foundation',
                per_page: 100,
              });

              return (response.data.workflow_runs || [])
                .filter(run =>
                  run &&
                  run.name === 'V4 Production Probe' &&
                  run.head_sha === targetSha &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() -
                    new Date(a.created_at).getTime(),
                )[0] || null;
            }

            if (eventName === 'workflow_run') {
              core.info('Waiting 25 minutes before the next self-chained probe.');
              await new Promise(resolve => setTimeout(resolve, 25 * 60 * 1000));
            }

            const latestProbe = await getLatestProbe();
            if (latestProbe) {
              const ageMinutes =
                (Date.now() - new Date(latestProbe.created_at).getTime()) / 60000;

              if (ageMinutes < 25) {
                core.info(
                  'Latest successful exact-SHA probe is only ' +
                  ageMinutes.toFixed(1) +
                  ' minutes old; skipping duplicate dispatch.',
                );
                return;
              }
            }

            async function waitForRailwaySuccess(ref) {
              const railwayContexts = [
                'satisfied-enthusiasm - ai-sales-analyst-v3',
                'satisfied-enthusiasm - peaceful-mindfulness',
              ];
              const deadline = Date.now() + 7 * 60 * 1000;

              while (Date.now() < deadline) {
                const combined = await github.rest.repos.getCombinedStatusForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                const statusByContext = new Map(
                  (combined.data.statuses || []).map(status => [status.context, status.state]),
                );
                const notReady = railwayContexts.filter(
                  contextName => statusByContext.get(contextName) !== 'success',
                );

                if (!notReady.length) {
                  return;
                }

                core.info(
                  'Railway deployment not ready yet: ' + notReady.join(', ') + '. Waiting 15 seconds.',
                );
                await new Promise(resolve => setTimeout(resolve, 15_000));
              }

              throw new Error(
                'Timed out waiting for Railway deployment success for ' + ref + '.',
              );
            }

            await waitForRailwaySuccess(targetSha);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'v4-production-probe.yml',
              ref: 'v4/saas-foundation',
              inputs: {
                release_sha: targetSha,
              },
            });

            core.summary
              .addHeading('V4 Production Probe Scheduler')
              .addRaw('Trigger: ' + eventName + '\n')
              .addRaw('Target release SHA: ' + targetSha + '\n')
              .addRaw('V4 branch head: ' + currentSha + '\n')
              .addRaw('Railway API/frontend statuses: success\n')
              .addRaw('Dispatched exact-SHA production probe.\n')
              .write();

# Deliberate operational design:
# - workflow_run self-chains after each successful exact-SHA probe
# - a 25-minute spacing guard prevents duplicate bursts
# - hourly cron remains as a recovery backstop if the event chain is interrupted

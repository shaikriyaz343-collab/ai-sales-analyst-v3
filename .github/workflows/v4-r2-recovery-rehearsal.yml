name: V4 R2 Recovery Rehearsal

on:
  push:
    branches:
      - ops/r2-failure-rehearsal
    paths:
      - .github/workflows/v4-r2-recovery-rehearsal.yml

permissions:
  contents: read

jobs:
  r2-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://ai-sales-analyst-v3-production.up.railway.app
      TEST_EMAIL: v4-durable-35460324124-1@example.com
      TEST_DATASET_ID: aab367e64ad944bb933d07a3b124d5d6
    steps:
      - name: Build deterministic test credentials
        shell: bash
        run: |
          set -euo pipefail
          password="$(printf '%s' 'ai-sales-analyst-v4-durable-rehearsal' | sha256sum | cut -d' ' -f1)"
          echo "DURABILITY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Assert production is ready after R2 restoration
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o ready.json -w '%{http_code}' "$API_URL/api/v1/ready")"
          test "$code" = "200"
          jq -e '.status == "ready" or .status == "READY"' ready.json >/dev/null

      - name: Authenticate durable-state account
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o login.json -w '%{http_code}'             -c cookies.txt             -H 'Content-Type: application/json'             -X POST "$API_URL/api/v1/auth/login"             --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$DURABILITY_PASSWORD\"}")"
          test "$code" = "200"

      - name: Verify R2-backed dataset reads recover
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o overview.json -w '%{http_code}'             -b cookies.txt             "$API_URL/api/v1/datasets/$TEST_DATASET_ID/overview")"
          echo "overview_http_code=$code"
          jq -r '.dataset_id // empty' overview.json
          test "$code" = "200"
          returned_id="$(jq -r '.dataset_id' overview.json)"
          test "$returned_id" = "$TEST_DATASET_ID"

      - name: Publish sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "R2 recovery rehearsal"
            echo "ready_http=200"
            echo "login_http=200"
            echo "overview_http=200"
            echo "dataset_id=$TEST_DATASET_ID"
          } > r2-recovery-evidence.txt
          cat r2-recovery-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v4-r2-recovery-evidence
          path: r2-recovery-evidence.txt
          retention-days: 180

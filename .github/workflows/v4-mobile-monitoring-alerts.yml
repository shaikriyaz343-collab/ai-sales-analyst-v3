name: V4 Mobile Monitoring Alerts

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-mobile-monitoring-alerts
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      V4_MOBILE_MONITORING_URL: https://ai-sales-analyst-v3-production.up.railway.app/api/v1/internal/mobile/monitoring-evaluate
      V4_BILLING_RECONCILIATION_TOKEN: ${{ secrets.V4_BILLING_RECONCILIATION_TOKEN }}
    steps:
      - name: Validate monitoring configuration
        shell: bash
        run: |
          set -euo pipefail
          case "${V4_MOBILE_MONITORING_URL}" in
            http://*|https://*) ;;
            *) echo "::error::V4_MOBILE_MONITORING_URL must be an absolute HTTP(S) URL."; exit 1 ;;
          esac
          if [[ -z "${V4_BILLING_RECONCILIATION_TOKEN}" ]]; then
            echo "::error::V4_BILLING_RECONCILIATION_TOKEN is not configured."; exit 1
          fi

      - name: Evaluate scheduled monitoring rules
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 60 -w "%{http_code}" -o response.json -X POST -H "X-V4-Reconciliation-Token: ${V4_BILLING_RECONCILIATION_TOKEN}" "${V4_MOBILE_MONITORING_URL}")"
          cat response.json
          if [[ "$status" != "200" ]]; then echo "::error::Mobile monitoring evaluation failed with HTTP $status."; exit 1; fi

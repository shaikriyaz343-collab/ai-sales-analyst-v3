name: V4 Mobile CI

on:
  pull_request:
    branches: [ v4/saas-foundation ]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [ v4/saas-foundation ]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline --fetch-retries=1 --fetch-timeout=120000

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo config check
        run: npx expo config --type public

      - name: Android bundle export
        run: npx expo export --platform android --output-dir dist

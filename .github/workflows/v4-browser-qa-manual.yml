name: V4 Browser Acceptance QA (Manual / Explicit Target)

on:
  push:
    branches: [ v4/saas-foundation ]
  workflow_dispatch:
    inputs:
      v4_app_url:
        description: "Deployed V4 frontend origin"
        required: false
        default: "https://peaceful-mindfulness-production-51b6.up.railway.app"
        type: string
      v4_e2e_api_url:
        description: "Deployed V4 FastAPI origin"
        required: false
        default: "https://ai-sales-analyst-v3-production.up.railway.app"
        type: string

jobs:
  v4-browser-qa:
    if: ${{ github.ref_name == 'v4/saas-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      V4_APP_URL: ${{ inputs.v4_app_url || 'https://peaceful-mindfulness-production-51b6.up.railway.app' }}
      V4_E2E_API_URL: ${{ inputs.v4_e2e_api_url || 'https://ai-sales-analyst-v3-production.up.railway.app' }}

    steps:
      - name: Validate V4 browser target
        run: |
          set -euo pipefail
          V4_APP_URL="${V4_APP_URL%/}"
          V4_E2E_API_URL="${V4_E2E_API_URL%/}"
          case "${V4_APP_URL}" in
            https://*.streamlit.app|http://*.streamlit.app)
              echo "::error::V4_APP_URL points to the legacy Streamlit deployment, not the V4 SaaS frontend."
              exit 1
              ;;
          esac
          case "${V4_APP_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::V4_APP_URL must be an absolute HTTP(S) URL."
              exit 1
              ;;
          esac
          case "${V4_E2E_API_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::V4_E2E_API_URL must be an absolute HTTP(S) URL."
              exit 1
              ;;
          esac
          echo "Testing deployed V4 frontend: ${V4_APP_URL}"
          echo "Testing deployed V4 API: ${V4_E2E_API_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for deployed V4 services
        run: |
          set -euo pipefail
          V4_APP_URL="${V4_APP_URL%/}"
          V4_E2E_API_URL="${V4_E2E_API_URL%/}"
          for attempt in $(seq 1 18); do
            api_health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${V4_E2E_API_URL}/api/v1/health" || true)
            api_ready=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${V4_E2E_API_URL}/api/v1/ready" || true)
            app_status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 10 "${V4_APP_URL}/" || true)
            echo "attempt=${attempt} api_health=${api_health} api_ready=${api_ready} app=${app_status}"
            if [ "${api_health}" = "200" ] && [ "${api_ready}" = "200" ] && [ "${app_status}" = "200" ]; then
              echo "Deployed V4 services are reachable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the deployed V4 frontend/API to become healthy."
          exit 1

      - name: Install V4 browser QA dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify V4 Playwright test discovery
        working-directory: e2e
        run: npx playwright test --list --config=v4-playwright.config.js

      - name: Run V4 browser acceptance suite
        working-directory: e2e
        run: npx playwright test --config=v4-playwright.config.js

      - name: Upload V4 browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v4-browser-qa-manual-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/v4-playwright-report/**

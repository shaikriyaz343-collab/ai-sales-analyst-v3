name: V4 Durable State Rehearsal

on:
  push:
    paths:
      - .github/workflows/v4-durable-state-rehearsal.yml
      - ops/v4-durable-state-target.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://ai-sales-analyst-v3-production.up.railway.app
      DURABILITY_PASSWORD: BrowserDurability123!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ops/v4-durable-state-target.json ]]; then
            mode=$(jq -r '.mode // "prepare"' ops/v4-durable-state-target.json)
          else
            mode=prepare
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Prepare durable state
        if: steps.mode.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          email="v4-durable-$stamp@example.com"

          signup_code=$(curl -sS -o signup.json -w '%{http_code}' \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            -X POST "$API_URL/api/v1/auth/signup" \
            --data "{\"email\":\"$email\",\"password\":\"$DURABILITY_PASSWORD\",\"name\":\"V4 Durable State\",\"organization_name\":\"V4 Durable Rehearsal $stamp\"}")
          test "$signup_code" = "200"

          upload_code=$(curl -sS -o upload.json -w '%{http_code}' \
            -b cookies.txt -c cookies.txt \
            -F 'file=@e2e/fixtures/retail.csv;type=text/csv' \
            "$API_URL/api/v1/onboarding/profile")
          test "$upload_code" = "200"

          dataset_id=$(jq -r '.dataset.dataset_id' upload.json)
          test -n "$dataset_id"
          test "$dataset_id" != "null"

          overview_code=$(curl -sS -o overview.json -w '%{http_code}' \
            -b cookies.txt \
            "$API_URL/api/v1/datasets/$dataset_id/overview")
          test "$overview_code" = "200"

          jq -n \
            --arg email "$email" \
            --arg dataset_id "$dataset_id" \
            '{mode:"verify",email:$email,dataset_id:$dataset_id}' \
            > prepared_target.json

          {
            echo "## V4 durable-state preparation"
            echo
            echo "Disposable account: \`$email\`"
            echo "Dataset ID: \`$dataset_id\`"
            echo
            echo "The repository target must be updated to \`mode=verify\` before the API restart so the post-restart read-back can be executed."
          } >> "$GITHUB_STEP_SUMMARY"

          cat prepared_target.json

      - name: Verify durable state after restart
        if: steps.mode.outputs.mode == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          email=$(jq -r '.email' ops/v4-durable-state-target.json)
          dataset_id=$(jq -r '.dataset_id' ops/v4-durable-state-target.json)

          login_code=$(curl -sS -o login.json -w '%{http_code}' \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            -X POST "$API_URL/api/v1/auth/login" \
            --data "{\"email\":\"$email\",\"password\":\"$DURABILITY_PASSWORD\"}")
          test "$login_code" = "200"

          me_code=$(curl -sS -o me.json -w '%{http_code}' \
            -b cookies.txt \
            "$API_URL/api/v1/auth/me")
          test "$me_code" = "200"

          overview_code=$(curl -sS -o overview.json -w '%{http_code}' \
            -b cookies.txt \
            "$API_URL/api/v1/datasets/$dataset_id/overview")
          test "$overview_code" = "200"

          returned_id=$(jq -r '.dataset_id' overview.json)
          test "$returned_id" = "$dataset_id"

          {
            echo "## V4 durable-state verification"
            echo
            echo "Login after API restart: **HTTP 200**"
            echo "Dataset overview read-back: **HTTP 200**"
            echo "Dataset ID preserved: \`$dataset_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

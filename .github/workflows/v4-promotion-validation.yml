name: V4 Promotion Validation

on:
  pull_request_target:
    branches: [ v4/saas-foundation ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@v6
        with:
          ref: v4/promotion-merge

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pytest
        run: python -m pip install "pytest>=8,<9"

      - name: Run V4 backend regression suite
        run: python -m pytest tests_v4_saas -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

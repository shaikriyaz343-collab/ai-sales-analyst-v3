name: V4 Promotion Validation

on:
  pull_request_target:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: startsWith(github.event.pull_request.title, '[V4 CI]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@v6
        with:
          ref: v4/promotion-merge

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pytest
        run: python -m pip install "pytest>=8,<9"

      - name: Run V4 backend regression suite
        run: python -m pytest tests_v4_saas -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Report validation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const state = success ? 'passed' : 'failed';
            const body = [
              `### V4 promotion validation ${state}`,
              '',
              `Candidate: \`v4/promotion-merge\``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              success
                ? 'Backend regression suite and frontend production build completed successfully.'
                : 'Validation failed. Inspect the workflow run for the failing step.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

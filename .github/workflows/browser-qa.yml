name: Browser Acceptance QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not configured."
            exit 1
          fi

          echo "Testing deployed app: ${APP_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser QA dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright test discovery
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test --list

      - name: Inspect deployed app with Playwright
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const appUrl = process.env.APP_URL;

          if (!appUrl) {
            throw new Error('APP_URL is not configured.');
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

            page.on('pageerror', error => {
              console.error(`PAGE ERROR: ${error.message}`);
            });

            console.log(`Opening deployed application: ${appUrl}`);

            try {
              await page.goto(appUrl, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              console.log(`Page loaded: ${page.url()}`);

              /*
               * Give Streamlit time to finish rendering.
               */
              await page.waitForTimeout(15000);

              console.log('\n===== PAGE TITLE =====');

              console.log(await page.title());

              console.log('\n===== VISIBLE PAGE TEXT =====');

              const bodyText = await page.locator('body').innerText();

              console.log(bodyText.slice(0, 10000));

              console.log('\n===== DATA-TESTID VALUES =====');

              const testIds = await page
                .locator('[data-testid]')
                .evaluateAll(elements => [
                  ...new Set(
                    elements
                      .map(el => el.getAttribute('data-testid'))
                      .filter(Boolean)
                  )
                ]);

              if (testIds.length === 0) {
                console.log('(none found)');
              } else {
                console.log(testIds.join('\n'));
              }

              console.log('\n===== INPUT ELEMENTS =====');

              const inputs = await page
                .locator('input')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    type: el.getAttribute('type'),
                    ariaLabel: el.getAttribute('aria-label'),
                    placeholder: el.getAttribute('placeholder'),
                    name: el.getAttribute('name')
                  }))
                );

              console.log(JSON.stringify(inputs, null, 2));

              console.log('\n===== TEXTAREAS =====');

              const textareas = await page
                .locator('textarea')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    ariaLabel: el.getAttribute('aria-label'),
                    placeholder: el.getAttribute('placeholder'),
                    name: el.getAttribute('name')
                  }))
                );

              console.log(JSON.stringify(textareas, null, 2));

              console.log('\n===== BUTTONS =====');

              const buttons = await page
                .locator('button')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    text: (el.innerText || '').trim(),
                    ariaLabel: el.getAttribute('aria-label'),
                    title: el.getAttribute('title')
                  }))
                );

              console.log(JSON.stringify(buttons, null, 2));

              console.log('\n===== LINKS =====');

              const links = await page
                .locator('a')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    text: (el.innerText || '').trim(),
                    href: el.getAttribute('href'),
                    ariaLabel: el.getAttribute('aria-label')
                  }))
                );

              console.log(JSON.stringify(links, null, 2));

              console.log('\n===== IFRAMES =====');

              const frames = await page
                .locator('iframe')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    src: el.getAttribute('src'),
                    title: el.getAttribute('title')
                  }))
                );

              console.log(JSON.stringify(frames, null, 2));

              console.log('\n===== PAGE URL =====');

              console.log(page.url());

              /*
               * Save the actual rendered page for inspection.
               */
              await page.screenshot({
                path: 'browser-readiness-diagnostic.png',
                fullPage: true
              });

              console.log(
                '\nDiagnostic screenshot saved: browser-readiness-diagnostic.png'
              );

            } catch (error) {
              console.error(
                `Browser diagnostic failed: ${error.message}`
              );

              try {
                await page.screenshot({
                  path: 'browser-readiness-diagnostic.png',
                  fullPage: true
                });

                console.log(
                  'Saved failure screenshot: browser-readiness-diagnostic.png'
                );
              } catch (screenshotError) {
                console.error(
                  `Could not save screenshot: ${screenshotError.message}`
                );
              }

              throw error;

            } finally {
              await browser.close();
            }
          })();
          NODE

      - name: Run browser acceptance
        if: ${{ false }}
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
            e2e/browser-qa.log
            e2e/browser-readiness-diagnostic.png

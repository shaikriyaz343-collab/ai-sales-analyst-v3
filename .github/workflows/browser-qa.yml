name: Browser Acceptance QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not configured."
            exit 1
          fi

          echo "Testing deployed app: ${APP_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          
      - name: Install browser QA dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright test discovery
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test --list

      - name: Open deployed app with Playwright
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const appUrl = process.env.APP_URL;

          if (!appUrl) {
            throw new Error('APP_URL is not configured.');
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            page.on('pageerror', error => {
              console.error(`PAGE ERROR: ${error.message}`);
            });

            console.log(`Opening deployed application: ${appUrl}`);

            try {
              await page.goto(appUrl, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              console.log(`Initial page loaded: ${page.url()}`);

              console.log(
                'Waiting for the application UI: "Upload your business file"...'
              );

              await page.getByText('Upload your business file', {
                exact: false
              }).waitFor({
                state: 'visible',
                timeout: 600000
              });

              console.log('Application UI is ready.');
              console.log(`Final page URL: ${page.url()}`);

            } catch (error) {
              console.error('Browser readiness check failed.');

              try {
                await page.screenshot({
                  path: 'browser-readiness-failure.png',
                  fullPage: true
                });

                console.log(
                  'Saved browser-readiness-failure.png'
                );
              } catch (screenshotError) {
                console.error(
                  `Could not save screenshot: ${screenshotError.message}`
                );
              }

              throw error;

            } finally {
              await browser.close();
            }
          })();
          NODE

      - name: Run browser acceptance
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
            e2e/browser-qa.log
            e2e/browser-readiness-failure.png

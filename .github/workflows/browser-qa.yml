name: Browser Acceptance QA

on:
  push:
    branches: [ main, v4/saas-foundation ]
  workflow_dispatch:

jobs:
  legacy-browser-qa:
    if: ${{ github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || vars.APP_URL != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not configured."
            exit 1
          fi
          echo "Testing legacy deployed app: ${APP_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser QA dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright test discovery
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test --list

      - name: Run browser acceptance suite
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/playwright-report/**

  v4-browser-qa:
    if: ${{ github.ref_name == 'v4/saas-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve and validate V4 browser target
        env:
          V4_APP_URL: ${{ vars.V4_APP_URL || 'https://peaceful-mindfulness-production-51b6.up.railway.app' }}
          V4_E2E_API_URL: ${{ vars.V4_E2E_API_URL || 'https://ai-sales-analyst-v3-production.up.railway.app' }}
        run: |
          set -e
          case "${V4_APP_URL}" in
            https://*.streamlit.app|http://*.streamlit.app)
              echo "::error::V4_APP_URL points to the legacy Streamlit deployment, not the V4 SaaS frontend."
              exit 1
              ;;
          esac
          case "${V4_APP_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::V4_APP_URL must be an absolute HTTP(S) URL."
              exit 1
              ;;
          esac
          case "${V4_E2E_API_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::V4_E2E_API_URL must be an absolute HTTP(S) URL."
              exit 1
              ;;
          esac
          echo "Testing deployed V4 frontend: ${V4_APP_URL}"
          echo "Testing deployed V4 API: ${V4_E2E_API_URL}"

      - name: Wait for deployed V4 release markers
        env:
          V4_APP_URL: ${{ vars.V4_APP_URL || 'https://peaceful-mindfulness-production-51b6.up.railway.app' }}
          V4_E2E_API_URL: ${{ vars.V4_E2E_API_URL || 'https://ai-sales-analyst-v3-production.up.railway.app' }}
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            api_ok=0
            frontend_ok=0

            if curl -fsS "${V4_E2E_API_URL}/api/v1/health" >/tmp/v4-api-health.json 2>/dev/null; then
              api_ok=1
            fi

            if curl -fsS "${V4_APP_URL}/" >/tmp/v4-home.html 2>/dev/null && \
               grep -Fq "<title>Avenlytics | AI Sales Analyst</title>" /tmp/v4-home.html; then
              frontend_ok=1
            fi

            if [ "${api_ok}" = "1" ] && [ "${frontend_ok}" = "1" ]; then
              echo "V4 frontend/API are reachable and the public application marker is live."
              cat /tmp/v4-api-health.json
              exit 0
            fi

            echo "Waiting for V4 deployment release marker (attempt ${attempt}/30, api_ok=${api_ok}, frontend_ok=${frontend_ok})..."
            sleep 10
          done
          echo "::error::V4 frontend/API did not expose the expected public application marker within the wait window."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install V4 browser QA dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify V4 Playwright test discovery
        working-directory: e2e
        env:
          V4_APP_URL: ${{ vars.V4_APP_URL || 'https://peaceful-mindfulness-production-51b6.up.railway.app' }}
          V4_E2E_API_URL: ${{ vars.V4_E2E_API_URL || 'https://ai-sales-analyst-v3-production.up.railway.app' }}
        run: npx playwright test --list --config=v4-playwright.config.js

      - name: Run V4 browser acceptance suite
        working-directory: e2e
        env:
          V4_APP_URL: ${{ vars.V4_APP_URL || 'https://peaceful-mindfulness-production-51b6.up.railway.app' }}
          V4_E2E_API_URL: ${{ vars.V4_E2E_API_URL || 'https://ai-sales-analyst-v3-production.up.railway.app' }}
        run: npx playwright test --config=v4-playwright.config.js

      - name: Upload V4 browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v4-browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/v4-playwright-report/**

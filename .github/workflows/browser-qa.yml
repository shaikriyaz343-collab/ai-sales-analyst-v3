name: Browser Acceptance QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not configured."
            exit 1
          fi

          echo "Testing deployed app: ${APP_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser QA dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright test discovery
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test --list

      - name: Inspect deployed app with Playwright
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const appUrl = process.env.APP_URL;

          if (!appUrl) {
            throw new Error('APP_URL is not configured.');
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

            page.on('pageerror', error => {
              console.error(`PAGE ERROR: ${error.message}`);
            });

            console.log(`Opening deployed application: ${appUrl}`);

            try {
              await page.goto(appUrl, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              console.log(`Outer page loaded: ${page.url()}`);

              /*
               * Give the Streamlit Cloud shell time to create
               * the application iframe.
               */
              await page.waitForTimeout(10000);

              console.log('\n===== ALL FRAMES =====');

              for (const [index, frame] of page.frames().entries()) {
                console.log(
                  `[FRAME ${index}] name="${frame.name()}" url="${frame.url()}"`
                );
              }

              /*
               * The actual Streamlit application is inside
               * the iframe titled "streamlitApp".
               */
              const appIframe = page.locator(
                'iframe[title="streamlitApp"]'
              );
              
              await appIframe.waitFor({
                state: 'attached',
                timeout: 60000
              });
              
              console.log(
                '\nStreamlit application iframe detected.'
              );
              
              const appFrame = await appIframe.contentFrame();
              
              if (!appFrame) {
                throw new Error(
                  'Could not access the content of the streamlitApp iframe.'
                );
              }
              
              console.log(
                `Application frame URL: ${appFrame.url()}`
              );
              console.log(
                `Application frame URL: ${appFrame.url()}`
              );

              /*
               * Allow the Streamlit application itself time
               * to finish rendering inside the iframe.
               */
              await appFrame.waitForLoadState('domcontentloaded', {
                timeout: 60000
              }).catch(() => {});

              await appFrame.waitForTimeout(10000);

              console.log('\n===== APPLICATION FRAME TEXT =====');

              const body = appFrame.locator('body');

              const bodyText = await body.innerText({
                timeout: 30000
              });

              console.log(
                bodyText.slice(0, 15000)
              );

              console.log(
                '\n===== APPLICATION DATA-TESTID VALUES ====='
              );

              const testIds = await appFrame
                .locator('[data-testid]')
                .evaluateAll(elements => [
                  ...new Set(
                    elements
                      .map(el => el.getAttribute('data-testid'))
                      .filter(Boolean)
                  )
                ]);

              if (testIds.length === 0) {
                console.log('(none found)');
              } else {
                console.log(testIds.join('\n'));
              }

              console.log(
                '\n===== APPLICATION INPUT ELEMENTS ====='
              );

              const inputs = await appFrame
                .locator('input')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    type: el.getAttribute('type'),
                    ariaLabel: el.getAttribute('aria-label'),
                    placeholder: el.getAttribute('placeholder'),
                    name: el.getAttribute('name'),
                    accept: el.getAttribute('accept')
                  }))
                );

              console.log(
                JSON.stringify(inputs, null, 2)
              );

              console.log(
                '\n===== APPLICATION FILE INPUTS ====='
              );

              const fileInputs = await appFrame
                .locator('input[type="file"]')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    ariaLabel: el.getAttribute('aria-label'),
                    accept: el.getAttribute('accept'),
                    name: el.getAttribute('name')
                  }))
                );

              console.log(
                JSON.stringify(fileInputs, null, 2)
              );

              console.log(
                '\n===== APPLICATION BUTTONS ====='
              );

              const buttons = await appFrame
                .locator('button')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    text: (el.innerText || '').trim(),
                    ariaLabel: el.getAttribute('aria-label'),
                    title: el.getAttribute('title')
                  }))
                );

              console.log(
                JSON.stringify(buttons, null, 2)
              );

              console.log(
                '\n===== APPLICATION SELECTS ====='
              );

              const selects = await appFrame
                .locator('select')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    ariaLabel: el.getAttribute('aria-label'),
                    name: el.getAttribute('name')
                  }))
                );

              console.log(
                JSON.stringify(selects, null, 2)
              );

              console.log(
                '\n===== APPLICATION TEXTAREAS ====='
              );

              const textareas = await appFrame
                .locator('textarea')
                .evaluateAll(elements =>
                  elements.map(el => ({
                    ariaLabel: el.getAttribute('aria-label'),
                    placeholder: el.getAttribute('placeholder'),
                    name: el.getAttribute('name')
                  }))
                );

              console.log(
                JSON.stringify(textareas, null, 2)
              );

              /*
               * Save the full rendered page.
               */
              await page.screenshot({
                path: 'browser-readiness-diagnostic.png',
                fullPage: true
              });

              console.log(
                '\nDiagnostic screenshot saved.'
              );

            } catch (error) {
              console.error(
                `Browser diagnostic failed: ${error.message}`
              );

              try {
                await page.screenshot({
                  path: 'browser-readiness-diagnostic.png',
                  fullPage: true
                });

                console.log(
                  'Failure screenshot saved.'
                );
              } catch (screenshotError) {
                console.error(
                  `Could not save screenshot: ${screenshotError.message}`
                );
              }

              throw error;

            } finally {
              await browser.close();
            }
          })();
          NODE

      - name: Run browser acceptance
        if: ${{ false }}
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
            e2e/browser-qa.log
            e2e/browser-readiness-diagnostic.png

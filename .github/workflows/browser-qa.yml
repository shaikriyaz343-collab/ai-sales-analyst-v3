name: Browser Acceptance QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not configured."
            exit 1
          fi
          echo "Testing deployed app: ${APP_URL}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Streamlit Cloud health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e
          BASE_URL="${APP_URL%/}"
          HEALTH_URL="${BASE_URL}/_stcore/health"

          echo "Checking: ${HEALTH_URL}"

          for i in $(seq 1 40); do
            echo "Health check ${i}/40..."

            BODY="$(curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 8 \
              --max-redirs 0 \
              "${HEALTH_URL}" 2>/tmp/curl_error || true)"

            CURL_STATUS=$?

            if [ "${BODY}" = "ok" ] || printf '%s' "${BODY}" | grep -qi '^ok$'; then
              echo "Streamlit health endpoint is healthy."
              exit 0
            fi

            if [ -s /tmp/curl_error ]; then
              echo "curl: $(cat /tmp/curl_error)"
            fi

            sleep 7
          done

          echo "::error::Streamlit health endpoint did not become healthy within 10 minutes."
          echo "Check the Streamlit Cloud deployment separately before debugging browser tests."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser QA dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright test discovery
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test --list

      - name: Run browser acceptance
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-results
          if-no-files-found: ignore
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
            e2e/browser-qa.log

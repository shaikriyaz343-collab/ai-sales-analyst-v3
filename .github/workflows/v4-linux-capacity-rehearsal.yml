name: V4 Linux Capacity Rehearsal

on:
  push:
    branches:
      - ops/v4-capacity-rehearsal

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: 37045d665a988009b5627385ff3eaa4c21c25a26
      API_URL: https://ai-sales-analyst-v3-production.up.railway.app
      TEST_EMAIL: v4-durable-35460324124-1@example.com
      TEST_DATASET_ID: aab367e64ad944bb933d07a3b124d5d6
      CONCURRENCY: 20
      REQUESTS_PER_WORKER: 10
    steps:
      - name: Build deterministic test credentials
        shell: bash
        run: |
          set -euo pipefail
          password="$(printf '%s' 'ai-sales-analyst-v4-durable-rehearsal' | sha256sum | cut -d' ' -f1)"
          echo "DURABILITY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Authenticate disposable account
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o login.json -w '%{http_code}'             -c cookies.txt             -H 'Content-Type: application/json'             -X POST "$API_URL/api/v1/auth/login"             --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$DURABILITY_PASSWORD\"}")"
          test "$code" = "200"

      - name: Run controlled read-only concurrency test
        shell: bash
        run: |
          set -euo pipefail
          : > results.txt
          export API_URL TEST_DATASET_ID
          seq "$CONCURRENCY" | xargs -n1 -P"$CONCURRENCY" -I{} bash -c '
            for i in $(seq 1 "$REQUESTS_PER_WORKER"); do
              curl -sS -o /dev/null -b cookies.txt                 -w "%{http_code} %{time_total}\n"                 "$API_URL/api/v1/datasets/$TEST_DATASET_ID/overview"
            done
          ' >> results.txt

          total="$(wc -l < results.txt)"
          failures="$(awk '$1 != 200 {count++} END {print count+0}' results.txt)"
          max_seconds="$(awk 'BEGIN{max=0} {if ($2>max) max=$2} END{printf "%.4f",max}' results.txt)"
          avg_seconds="$(awk 'BEGIN{sum=0} {sum+=$2} END{if(NR) printf "%.4f",sum/NR; else print "0"}' results.txt)"

          echo "release_sha=$RELEASE_SHA" > capacity-evidence.txt
          echo "concurrency=$CONCURRENCY" >> capacity-evidence.txt
          echo "requests_per_worker=$REQUESTS_PER_WORKER" >> capacity-evidence.txt
          echo "total_requests=$total" >> capacity-evidence.txt
          echo "failed_requests=$failures" >> capacity-evidence.txt
          echo "avg_latency_seconds=$avg_seconds" >> capacity-evidence.txt
          echo "max_latency_seconds=$max_seconds" >> capacity-evidence.txt

          cat capacity-evidence.txt >> "$GITHUB_STEP_SUMMARY"
          test "$total" -eq "$((CONCURRENCY * REQUESTS_PER_WORKER))"
          test "$failures" -eq 0

      - name: Upload capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: v4-linux-capacity-rehearsal
          path: capacity-evidence.txt
          retention-days: 180

name: Exact V4 Linux Capacity Rehearsal

on:
  push:
    branches:
      - ops/fed2db9-capacity-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: fed2db9a7e949205288fb6e7525de96aaa14bae5
      API_URL: https://ai-sales-analyst-v3-production.up.railway.app
      CONCURRENCY: 4
      REQUESTS_PER_WORKER: 25

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: fed2db9a7e949205288fb6e7525de96aaa14bae5
          fetch-depth: 1

      - name: Verify checked-out release SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "checked_out_sha=$actual"
          test "$actual" = "$RELEASE_SHA"

      - name: Create disposable production test account
        shell: bash
        run: |
          set -euo pipefail
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          email="v4-capacity-$suffix@example.com"
          password="V4Cap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-x9"
          echo "TEST_EMAIL=$email" >> "$GITHUB_ENV"
          echo "TEST_PASSWORD=$password" >> "$GITHUB_ENV"

          payload="$(jq -nc             --arg email "$email"             --arg password "$password"             --arg name "V4 Capacity Rehearsal"             --arg org "V4 Capacity $suffix"             '{email:$email,password:$password,name:$name,organization_name:$org}')"

          code="$(curl -sS -o signup.json -w '%{http_code}'             -c cookies.txt             -H 'Content-Type: application/json'             -X POST "$API_URL/api/v1/auth/signup"             --data "$payload")"

          echo "signup_http=$code"
          if [[ "$code" != "200" ]]; then
            cat signup.json
            exit 1
          fi

      - name: Upload deterministic fixture dataset
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o upload.json -w '%{http_code}'             -b cookies.txt -c cookies.txt             -F 'file=@e2e/fixtures/retail.csv;type=text/csv'             "$API_URL/api/v1/onboarding/profile")"
          echo "upload_http=$code"
          if [[ "$code" != "200" ]]; then
            cat upload.json
            exit 1
          fi

          dataset_id="$(jq -r '.dataset.dataset_id' upload.json)"
          test -n "$dataset_id"
          test "$dataset_id" != "null"
          echo "TEST_DATASET_ID=$dataset_id" >> "$GITHUB_ENV"
          echo "dataset_id=$dataset_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify baseline dataset access
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o baseline.json -w '%{http_code}'             -b cookies.txt             "$API_URL/api/v1/datasets/$TEST_DATASET_ID/overview")"
          echo "baseline_http=$code"
          test "$code" = "200"
          returned="$(jq -r '.dataset_id' baseline.json)"
          test "$returned" = "$TEST_DATASET_ID"

      - name: Run controlled read-only concurrency test
        shell: bash
        run: |
          set -euo pipefail
          : > results.txt

          seq "$CONCURRENCY" | xargs -P"$CONCURRENCY" -I{} bash -c '
            for i in $(seq 1 "$REQUESTS_PER_WORKER"); do
              curl -sS -o /dev/null -b cookies.txt                 -w "%{http_code} %{time_total}\n"                 "$API_URL/api/v1/datasets/$TEST_DATASET_ID/overview" || true
            done
          ' >> results.txt

          total="$(wc -l < results.txt)"
          failures="$(awk '$1 != 200 {count++} END {print count+0}' results.txt)"
          max_seconds="$(awk 'BEGIN{max=0} {if ($2>max) max=$2} END{printf "%.4f",max}' results.txt)"
          avg_seconds="$(awk 'BEGIN{sum=0} {sum+=$2} END{if(NR) printf "%.4f",sum/NR; else print "0"}' results.txt)"

          {
            echo "release_sha=$RELEASE_SHA"
            echo "configured_analysis_concurrency=4"
            echo "concurrency_workers=$CONCURRENCY"
            echo "requests_per_worker=$REQUESTS_PER_WORKER"
            echo "total_requests=$total"
            echo "failed_requests=$failures"
            echo "avg_latency_seconds=$avg_seconds"
            echo "max_latency_seconds=$max_seconds"
          } | tee capacity-evidence.txt >> "$GITHUB_STEP_SUMMARY"

          test "$total" -eq "$((CONCURRENCY * REQUESTS_PER_WORKER))"
          test "$failures" -eq 0

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o ready.json -w '%{http_code}' "$API_URL/api/v1/ready")"
          test "$code" = "200"
          jq -e '.status == "ready" or .status == "READY"' ready.json >/dev/null

      - name: Upload capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-v4-linux-capacity-rehearsal-v2
          path: capacity-evidence.txt
          retention-days: 90

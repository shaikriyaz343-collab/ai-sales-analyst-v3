name: V4 Sharp Lockfile Regeneration

on:
  push:
    branches: [v4/sharp-lockfile-regeneration-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile with npm audit fix
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          git diff -- frontend/package.json frontend/package-lock.json
          if ! git diff --quiet -- frontend/package.json; then
            echo 'package.json changed unexpectedly' >&2
            exit 1
          fi
          node -e "const p=require('./package-lock.json'); const s=p.packages['node_modules/sharp']; if(!s){throw new Error('sharp resolution missing')}; if(s.version!=='0.35.4'){throw new Error('expected sharp 0.35.4, found '+s.version)}; console.log('sharp',s.version)"
      - name: Install exact lockfile
        run: npm ci
      - name: Audit production dependency tree
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Commit generated lockfile only
        run: |
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change generated.'
            exit 0
          fi
          git commit -m 'fix: update sharp to patched release'
          git push origin HEAD:v4/sharp-lockfile-regeneration-final

# Explicitly rerun after the first audit-only generation attempt.
